[/Script/SourceCodeAccess.SourceCodeAccessSettings]
; "Rider Uproject" no es un nombre inventado: es el FName del accessor agregado que registra
; RiderSourceCodeAccess para el modelo .uproject (RiderSourceCodeAccessorModule.cpp). El del
; modelo .sln se llama "Rider" a secas y se autodesactiva si no existe el .sln.
;
; Esto es solo la semilla para una maquina nueva. Una vez que el editor arranca, manda
; %LOCALAPPDATA%\UnrealEngine\5.8\Saved\Config\WindowsEditor\EditorSettings.ini, que es global
; a todos los proyectos y se edita desde Editor Preferences > Source Code.
PreferredAccessor=Rider Uproject
