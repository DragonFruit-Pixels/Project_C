[/Script/SourceCodeAccess.SourceCodeAccessSettings]
; "Rider Uproject" is not a made-up name: it is the FName of the aggregate accessor that
; RiderSourceCodeAccess registers for the .uproject model (RiderSourceCodeAccessorModule.cpp).
; The one for the .sln model is called plain "Rider" and disables itself if no .sln exists.
;
; This is only the seed for a fresh machine. Once the editor starts,
; %LOCALAPPDATA%\UnrealEngine\5.8\Saved\Config\WindowsEditor\EditorSettings.ini wins: it is
; global to every project and is edited from Editor Preferences > Source Code.
PreferredAccessor=Rider Uproject
